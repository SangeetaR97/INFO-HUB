  document.getElementById("introLine").innerText = (lang==="hi" ? "नीचे किसी टूल का चयन करें — शुरुआती से उन्नत तक के चरण, प्रॉम्प्ट उदाहरण और सर्वोत्तम अभ्यास।" : (lang==="kn" ? "ಕೆಳಗಿನ ಉಪಕರಣಗಳನ್ನು ಆಯ್ಕೆ ಮಾಡಿ — ಆರಂಭಿಕರಿಂದ ಪ್ರಗತಿಪರ ಹಂತ ಮತ್ತು ಉದಾಹರಣೆಗಳು." : "Choose a tool below to read beginner → advanced steps, prompt examples, and best practices."));

  Object.keys(TOOLS).forEach(key=>{
    const t = TOOLS[key];

    const short = t.short[lang] || t.short.en;
    const steps = t.steps[lang] || t.steps.en;
    const usecases = t.usecases[lang] || t.usecases.en;

    const div = document.createElement("div");
    div.className = "tool";
    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2>${title}</h2>
        <div class="flex-row">
          <button class="btn copyBtn small" data-key="${key}" aria-label="Copy prompt">Copy Prompt</button>
          <button class="btn speakBtn small" data-key="${key}" aria-label="Read aloud">Read Aloud</button>
        </div>
      </div>
      <div class="section"><strong>${short}</strong></div>
      <div class="section"><em>${(lang==="hi"?"स्टेप्स:":(lang==="kn"?"ಹಂತಗಳು:":"Steps:"))}</em>
        ${ steps.map(s=>`<div class="small"><strong>${s.title}</strong><div class="code">${s.text}</div></div>`).join("") }
      </div>
      <div class="section"><strong>${(lang==="hi"?"उपयोग के मामले:":(lang==="kn"?"ಬಳಕೆ ಪ್ರಕರಣಗಳು:":"Use cases:"))}</strong>
        <ul class="usage-list">${ usecases.map(u=>`<li>${u}</li>`).join("") }</ul>
      </div>
      <div class="section"><strong>${(lang==="hi"?"प्रॉम्प्ट उदाहरण:":(lang==="kn"?"ಪ್ರಾಂಪ್ಟ್ ಉದಾಹರಣೆ:":"Prompt example:"))}</strong>
        <div class="code" id="prompt_${key}">${example}</div>
      </div>
    `;
    area.appendChild(div);
  });

  // attach button handlers (copy & speak)
  document.querySelectorAll(".copyBtn").forEach(btn=>{
    btn.onclick = async (e)=>{
      const k = e.currentTarget.dataset.key;
      const text = document.getElementById("prompt_" + k).innerText;
      try { await navigator.clipboard.writeText(text); alert((lang==="hi"?"कॉपी हो गया":"Copied") + " ✓"); }
      catch { alert((lang==="hi"?"कॉपी असफल":"Copy failed")); }
    };
  });

  document.querySelectorAll(".speakBtn").forEach(btn=>{
    btn.onclick = (e)=>{
      const k = e.currentTarget.dataset.key;
      const text = document.getElementById("prompt_" + k).innerText + ". " + TOOLS[k].short[lang];
      speakText(text, lang);
    };
  });
}

/* TTS helper for the page - uses browser speechSynthesis (works offline in browser) */
function speakText(text, lang){
  if(!window.speechSynthesis) { alert("Speech not supported in this browser"); return; }
  const u = new SpeechSynthesisUtterance(text);
  if(lang==="hi") u.lang = "hi-IN";
  else if(lang==="kn") u.lang = "kn-IN";
  else u.lang = "en-US";
  u.rate = 1.0;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

/* Language selector */
const sel = document.getElementById("langTool");
sel.addEventListener("change", ()=> renderTools(sel.value) );

/* render default */
renderTools("en");
</script>
</body>
</html>
